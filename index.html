<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Tóth Gergő</title>
  </head>
  <body>
    <main>
      <header><h1>Űrlap</h1></header>
      <nav>
        <ul>
          <li><a href="index.html">Menü</a></li>
          <li><a href="index.html">Menü</a></li>
          <li><a href="index.html">Menü</a></li>
        </ul>
      </nav>
      <article>
        <form>
            <fieldset>
          <div class="block">
            <label for="nev">Név</label>
            <input
              type="text"
              name="nev"
              id="nev"
              placeholder="Vezetéknév Keresztnév"
            />
            </fieldset>
          </div>

          <div class="block">
            <label for="psw">Jelszó</label>
            <input type="password" name="psw" id="psw" />
          </div>

          <div class="block">
            <label for="email">E-mail</label>
            <input type="email" name="email" id="email" />
          </div>

          <div class="block">
            <input type="submit" value="Küld" />
          </div>
          <fieldset>
            <legend>Nem</legend>
            <label for="ffi">Férfi</label>
            <input type="radio" name="nem" id="ffi">
            <label for="no"></label>

          </fieldset>
        </form>
      </article>
      <footer>
        <p>Tóth Gergő</p>
      </footer>
    </main>
  </body>
